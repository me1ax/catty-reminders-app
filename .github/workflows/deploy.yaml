name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
      - name: Prepare image name
        id: prep
        run: |
          LOWERCASE=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "image_name=${LOWERCASE}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3151
          script: |
            IMG="ghcr.io/${{ steps.prep.outputs.image_name }}:latest"
            PROJECT_DIR="/home/vboxuser/devops-lab/catty-reminders-app"

            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            cat > docker-compose.yaml << 'END'
            name: catty-reminders

            services:
              app:
                image: $IMG
                ports:
                  - "8181:8181"
                environment:
                  - DEPLOY_REF=${DEPLOY_REF:-NA}
                volumes:
                  - app-data:/app/data
                depends_on:
                  - db
                restart: unless-stopped

              db:
                image: postgres:15-alpine
                environment:
                  POSTGRES_USER: catty
                  POSTGRES_PASSWORD: catty123
                  POSTGRES_DB: catty_reminders
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                restart: unless-stopped

            volumes:
              app-data:
              postgres-data:
            END

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose down 2>/dev/null || true
            docker pull $IMG
            docker compose up -d
            docker system prune -f
