name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3151
          script: |
            docker stop catty-app 2>/dev/null || true
            docker rm catty-app 2>/dev/null || true
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u me1ax --password-stdin
            docker pull ghcr.io/me1ax/catty-reminders-app:latest
            docker run -d \
              --name catty-app \
              -p 8181:8181 \
              --restart always \
              ghcr.io/me1ax/catty-reminders-app:latest
            echo "✅ Deployment complete"
